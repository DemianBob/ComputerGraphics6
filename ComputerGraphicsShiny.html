<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система частиц WebGL</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0,0,0,0.85);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            backdrop-filter: blur(5px);
        }
        button {
            display: block;
            width: 200px;
            margin: 6px 0;
            padding: 12px 15px;
            background: #2a2a2a;
            color: #ccc;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            text-align: left;
            transition: all 0.2s;
        }
        button:hover {
            background: #3a3a3a;
            color: #fff;
            border-color: #888;
        }
        button.active {
            background: #cc5500;
            border-color: #ff8800;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 136, 0, 0.4);
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="btn0" class="active">Бенгальский огонь</button>
        <button id="btn1">Дым</button>
        <button id="btn2">Дождь</button>
        <button id="btn3">Облака / Пар</button>
        <button id="btn4">Фейерверки</button>
    </div>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const gl = canvas.getContext('webgl', {
            antialias: true,
            alpha: false
        });
        
        if (!gl) {
            document.body.innerHTML = '<h1 style="color:white;text-align:center;margin-top:50px;">WebGL не поддерживается</h1>';
            throw new Error('WebGL не поддерживается');
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        // Вершинный шейдер
        const vsSource = `
            precision highp float;
            
            attribute vec2 a_position;
            attribute float a_index;
            
            uniform float u_time;
            uniform float u_type;
            uniform vec2 u_resolution;
            
            varying vec4 v_color;
            varying float v_alpha;
            varying float v_dist;
            varying float v_rand;
            
            float rand(float n) {
                return fract(sin(n) * 43758.5453123);
            }
            
            float noise(float n) {
                float i = floor(n);
                float f = fract(n);
                f = f * f * (3.0 - 2.0 * f);
                return mix(rand(i), rand(i + 1.0), f);
            }
            
            void main() {
                float i = a_index;
                vec2 pos = vec2(0.0);
                vec4 col = vec4(1.0);
                float size = 4.0;
                float alpha = 1.0;
                float dist = 0.0;
                float randVal = 0.0;
                
                if (u_type == 0.0) {
                    // БЕНГАЛЬСКИЙ ОГОНЬ
                    float seed = i * 137.946;
                    
                    float angle = rand(seed) * 6.28318;
                    float spiralShift = sin(u_time * 3.0 + i * 0.1) * 0.3;
                    angle += spiralShift;
                    
                    float speed = 0.15 + rand(seed + 1.0) * 1.2;
                    float life = fract(u_time * 0.6 + rand(seed + 2.0));
                    float r = life * speed;
                    
                    pos.x = cos(angle) * r;
                    pos.y = sin(angle) * r;
                    
                    pos.x += sin(u_time * 10.0 + i) * 0.01;
                    pos.y += cos(u_time * 8.0 + i * 1.3) * 0.01;
                    
                    float t = life;
                    vec3 innerColor = vec3(1.0, 0.95, 0.7);
                    vec3 midColor   = vec3(1.0, 0.6, 0.1);
                    vec3 outerColor = vec3(0.9, 0.2, 0.0);
                    
                    if (t < 0.3) {
                        col.rgb = mix(innerColor, midColor, t / 0.3);
                    } else if (t < 0.7) {
                        col.rgb = mix(midColor, outerColor, (t - 0.3) / 0.4);
                    } else {
                        col.rgb = outerColor;
                    }
                    
                    float brightness = 0.6 + rand(seed + 3.0) * 0.4;
                    col.rgb *= brightness;
                    col.a = 1.0;
                    
                    size = (1.5 + rand(seed + 4.0) * 2.5) * (1.0 - t * 0.5);
                    alpha = 1.0 - t * t;
                    
                    if (r < 0.1) alpha = 1.0;
                    dist = r;
                    randVal = rand(seed + 5.0);
                }
                else if (u_type == 1.0) {
                    // ДЫМ
                    float seed = i * 456.789;
                    
                    float x0 = (rand(seed) - 0.5) * 0.02;
                    float y0 = -0.85;
                    
                    float life = fract(u_time * 0.12 + rand(seed + 1.0));
                    float y = y0 + life * 1.8;
                    
                    float expandWidth = 0.005 + life * 0.08;
                    
                    float turb1 = noise(u_time * 2.0 + i * 0.02) * 2.0 - 1.0;
                    float turb2 = noise(u_time * 1.4 + i * 0.04 + 10.0) * 2.0 - 1.0;
                    float turb3 = noise(u_time * 2.6 + i * 0.015 + 20.0) * 2.0 - 1.0;
                    
                    float turbulence = (turb1 * 0.03 + turb2 * 0.02 + turb3 * 0.01) * life;
                    
                    pos.x = x0 + (rand(seed + 2.0) - 0.5) * expandWidth + turbulence;
                    pos.y = y;
                    
                    float gray = 0.12 + life * 0.5 + rand(seed + 3.0) * 0.08;
                    col = vec4(gray, gray, gray, 1.0);
                    
                    size = 5.0 + rand(seed + 4.0) * 8.0 + life * 18.0;
                    
                    if (life < 0.1) {
                        alpha = life / 0.1 * 0.45;
                    } else if (life > 0.75) {
                        alpha = (1.0 - life) / 0.25 * 0.45;
                    } else {
                        alpha = 0.45;
                    }
                    alpha *= 0.7 + rand(seed + 5.0) * 0.3;
                    randVal = rand(seed + 6.0);
                }
                else if (u_type == 2.0) {
                    // ДОЖДЬ
                    float seed = i * 789.123;
                    float x = -1.0 + rand(seed) * 2.0;
                    float speed = 0.6 + rand(seed + 1.0) * 0.6;
                    float y = 1.1 - fract(u_time * speed + rand(seed + 2.0)) * 2.2;
                    pos.x = x;
                    pos.y = y;
                    col = vec4(0.55, 0.75, 0.95, 1.0);
                    size = 2.0 + rand(seed + 3.0) * 2.0;
                    alpha = 0.55 + rand(seed + 4.0) * 0.35;
                    randVal = rand(seed + 5.0);
                }
                else if (u_type == 3.0) {
                    float seed = i * 234.567;
                    
                    float centerY = 0.2;
                    float centerX = 0.0;
                    
                    float x = -1.5 + rand(seed + 1.0) * 3.0;
                    float driftSpeed = 0.003 + rand(seed + 2.0) * 0.005;
                    x = mod(x + u_time * driftSpeed + 1.5, 3.0) - 1.5;
                    
                    pos.x = x;
                    
                    float randomY = (rand(seed + 3.0) - 0.5) * 0.6;
                    float wave = sin(u_time * 0.04 + x * 0.2) * 0.03;
                    pos.y = centerY + randomY + wave;
                    
                    float bright = 0.78 + rand(seed + 4.0) * 0.12;
                    col = vec4(bright, bright, bright + 0.02, 1.0);
                    
                    size = 60.0 + rand(seed + 5.0) * 70.0;
                    
                    randVal = rand(seed + 6.0);
                    alpha = 0.05 + randVal * 0.35;
                    
                    float distFromCenter = abs(pos.y - centerY);
                    float edgeSoftness = 0.35;
                    float edgeFade = 1.0 - smoothstep(0.0, edgeSoftness, distFromCenter);
                    alpha *= 0.65 + edgeFade * 0.35;
                    
                    float distX = abs(pos.x - centerX);
                    float edgeX = 1.0 - smoothstep(0.6, 1.2, distX);
                    alpha *= 0.6 + edgeX * 0.4;
                }
                else if (u_type == 4.0) {
                    // ФЕЙЕРВЕРКИ
                    float seed = i * 567.890;
                    float burst = floor(i / 150.0);
                    float local = mod(i, 150.0) / 150.0;
                    float burstTime = fract(u_time * 0.12 + burst * 0.75);
                    float explodeTime = 0.28;
                    float life;
                    
                    if (burstTime < explodeTime) {
                        pos.y = -1.0 + (burstTime / explodeTime) * 1.6;
                        pos.x = -0.5 + rand(burst * 111.111) * 1.0;
                        life = 0.0;
                    } else {
                        float explodeLife = (burstTime - explodeTime) / (1.0 - explodeTime);
                        float angle = local * 6.28318;
                        float speed = 0.08 + rand(seed) * 0.55;
                        float grav = 0.25;
                        float bx = -0.5 + rand(burst * 111.111) * 1.0;
                        float by = -0.25 + rand(burst * 222.222) * 0.65;
                        pos.x = bx + cos(angle) * speed * explodeLife;
                        pos.y = by + sin(angle) * speed * explodeLife - grav * explodeLife * explodeLife;
                        life = 1.0 - explodeLife;
                    }
                    
                    float colorChoice = rand(seed + 88.888);
                    vec3 fireColor;
                    if(colorChoice < 0.2) fireColor = vec3(1.0, 0.15, 0.15);
                    else if(colorChoice < 0.4) fireColor = vec3(0.15, 1.0, 0.15);
                    else if(colorChoice < 0.6) fireColor = vec3(0.2, 0.45, 1.0);
                    else if(colorChoice < 0.8) fireColor = vec3(1.0, 0.75, 0.0);
                    else fireColor = vec3(1.0, 0.4, 0.9);
                    
                    col = vec4(fireColor, 1.0);
                    size = 2.5 + rand(seed + 10.0) * 3.5;
                    alpha = life;
                    randVal = rand(seed + 11.0);
                }
                
                gl_Position = vec4(pos.x, pos.y, 0.0, 1.0);
                gl_PointSize = size * (u_resolution.y / 500.0);
                v_color = col;
                v_alpha = alpha;
                v_dist = dist;
                v_rand = randVal;
            }
        `;

        // Фрагментный шейдер
        const fsSource = `
            precision highp float;
            
            varying vec4 v_color;
            varying float v_alpha;
            varying float v_dist;
            varying float v_rand;
            
            uniform float u_type;
            uniform float u_time;
            
            void main() {
                vec2 uv = gl_PointCoord - vec2(0.5);
                float d = length(uv);
                
                vec4 color = v_color;
                float alpha = v_alpha;
                
                if (u_type == 0.0) {
                    // БЕНГАЛЬСКИЙ ОГОНЬ
                    float glow = exp(-d * 2.8);
                    float innerGlow = exp(-d * 6.0);
                    float sparkle = sin(d * 18.0 - u_time * 8.0) * 0.25 + 0.75;
                    float sparkle2 = cos(d * 25.0 + u_time * 12.0) * 0.2 + 0.8;
                    alpha *= glow * sparkle * sparkle2;
                    alpha += innerGlow * 0.5;
                    color.rgb *= 1.6;
                    if (d < 0.15) {
                        color.rgb = mix(color.rgb, vec3(1.0, 1.0, 0.95), (0.15 - d) / 0.15 * 0.7);
                    }
                }
                else if (u_type == 1.0) {
                    // ДЫМ
                    float falloff = exp(-d * 5.0);
                    alpha *= falloff;
                }
                else if (u_type == 2.0) {
                    // ДОЖДЬ
                    float shape = 1.0 - smoothstep(0.0, 0.4, abs(uv.y));
                    shape *= exp(-abs(uv.x) * 12.0);
                    alpha *= shape;
                }
                else if (u_type == 3.0) {
                    // ОБЛАКА
                    float soft = 1.0 - smoothstep(0.0, 0.5, d);
                    float innerVariation = 0.6 + v_rand * 0.4;
                    float spottyPattern = sin(d * 8.0 + v_rand * 6.28) * 0.3 + 0.7;
                    alpha *= soft * soft * innerVariation * spottyPattern;
                    float clumps = sin(uv.x * 5.0 + v_rand * 10.0) * cos(uv.y * 5.0 + v_rand * 8.0) * 0.3 + 0.7;
                    alpha *= clumps;
                }
                else if (u_type == 4.0) {
                    // ФЕЙЕРВЕРКИ
                    float star = exp(-d * 3.5);
                    float rays = abs(sin(atan(uv.y, uv.x) * 7.0 + u_time * 2.0));
                    alpha *= star * (0.55 + rays * 0.45);
                    color.rgb *= 1.9;
                }
                
                if(d > 0.5) discard;
                
                gl_FragColor = vec4(color.rgb, alpha);
            }
        `;

        // Компиляция шейдеров
        function createShader(gl, source, type) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Ошибка компиляции шейдера:', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        const vertexShader = createShader(gl, vsSource, gl.VERTEX_SHADER);
        const fragmentShader = createShader(gl, fsSource, gl.FRAGMENT_SHADER);
        
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error('Ошибка линковки:', gl.getProgramInfoLog(program));
            throw new Error('Failed to link program');
        }

        const aPosition = gl.getAttribLocation(program, 'a_position');
        const aIndex = gl.getAttribLocation(program, 'a_index');
        const uTime = gl.getUniformLocation(program, 'u_time');
        const uType = gl.getUniformLocation(program, 'u_type');
        const uResolution = gl.getUniformLocation(program, 'u_resolution');

        // Буферы частиц
        function createBuffers(count) {
            const positions = new Float32Array(count * 2);
            const indices = new Float32Array(count);
            
            for (let i = 0; i < count; i++) {
                positions[i * 2] = 0;
                positions[i * 2 + 1] = 0;
                indices[i] = i;
            }
            
            const posBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
            
            const idxBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, idxBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, indices, gl.STATIC_DRAW);
            
            return { pos: posBuffer, idx: idxBuffer, count: count };
        }

        let currentType = 0;
        const particleCounts = [800, 2000, 1200, 2500, 1500];
        let buffers = createBuffers(particleCounts[0]);

        function setActiveButton(index) {
            for (let i = 0; i < 5; i++) {
                const btn = document.getElementById('btn' + i);
                btn.classList.toggle('active', i === index);
            }
        }

        function switchType(type) {
            currentType = type;
            gl.deleteBuffer(buffers.pos);
            gl.deleteBuffer(buffers.idx);
            buffers = createBuffers(particleCounts[type]);
            setActiveButton(type);
        }

        document.getElementById('btn0').onclick = () => switchType(0);
        document.getElementById('btn1').onclick = () => switchType(1);
        document.getElementById('btn2').onclick = () => switchType(2);
        document.getElementById('btn3').onclick = () => switchType(3);
        document.getElementById('btn4').onclick = () => switchType(4);

        function render(timestamp) {
            resize();
            
            gl.clearColor(0.0, 0.0, 0.0, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            
            gl.useProgram(program);
            gl.enable(gl.BLEND);
            
            if (currentType === 0 || currentType === 4) {
                gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
            } else {
                gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            }
            
            gl.bindBuffer(gl.ARRAY_BUFFER, buffers.pos);
            gl.enableVertexAttribArray(aPosition);
            gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);
            
            gl.bindBuffer(gl.ARRAY_BUFFER, buffers.idx);
            gl.enableVertexAttribArray(aIndex);
            gl.vertexAttribPointer(aIndex, 1, gl.FLOAT, false, 0, 0);
            
            gl.uniform1f(uTime, timestamp * 0.001);
            gl.uniform1f(uType, currentType);
            gl.uniform2f(uResolution, canvas.width, canvas.height);
            
            gl.drawArrays(gl.POINTS, 0, buffers.count);
            gl.disable(gl.BLEND);
            
            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
